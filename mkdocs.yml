    - Policy Engine Requirements: design/policy-engine-requirements.md
    - Credential Provider: design/credential-provider.md
    - Credential Provider Requirements: design/credential-provider-requirements.md
    - Approval Service: design/approval-service.md
    - Approval Service Requirements: design/approval-service-requirements.md
    - Audit Enricher: design/audit-enricher.md
    - Audit Enricher Requirements: design/audit-enricher-requirements.md
    - Topology Integration: design/topology-integration.md
    - Topology Integration Requirements: design/topology-integration-requirements.md
    - Implementation Plan: design/implementation-plan.md
    - LLM Gateway: design/llm-gateway.md
    - MCP Gateway: design/mcp-gateway.md
    - Eval Framework: design/eval-framework.md
