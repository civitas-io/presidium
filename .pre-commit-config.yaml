repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy-presidium
        name: mypy (presidium)
        # --frozen: use the committed uv.lock as-is -- confirmed real, needed
        # (2026-08-24): without it, a plain `uv run` can trigger a real
        # lockfile re-resolution as a side effect of running the hook, which
        # pre-commit then reports as a false "Failed" (files were modified),
        # even when mypy itself passes cleanly.
        entry: bash -c 'cd packages/presidium && uv run --frozen mypy src/presidium/'
        language: system
        pass_filenames: false
        files: ^packages/presidium/src/
        types: [python]

      - id: mypy-contrib
        name: mypy (presidium-contrib)
        entry: bash -c 'cd packages/presidium-contrib && uv run --frozen mypy src/presidium_contrib/'
        language: system
        pass_filenames: false
        files: ^packages/presidium-contrib/src/
        types: [python]

      - id: tests-presidium
        name: tests (presidium)
        entry: uv run --frozen --package presidium pytest packages/presidium/tests/ -x -q --no-header --tb=line --no-cov
        language: system
        pass_filenames: false
        files: ^packages/presidium/
        types: [python]
        stages: [pre-push]

      - id: tests-contrib
        name: tests (presidium-contrib)
        entry: bash -c 'cd packages/presidium-contrib && uv run --frozen pytest tests/ -x -q --no-header --tb=line --no-cov'
        language: system
        pass_filenames: false
        files: ^packages/presidium-contrib/
        types: [python]
        stages: [pre-push]
