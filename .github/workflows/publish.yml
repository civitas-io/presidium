name: Publish to PyPI

# Real, verified commit SHAs (never guessed) — looked up via GitHub's own
# releases/tags API, dereferencing annotated tag objects one level further
# where needed. Matches the exact versions already proven live in
# civitas-io/fabrica's own real v0.1.0 release.
#   actions/checkout            v7.0.1
#   astral-sh/setup-uv          v10.0.1
#   actions/upload-artifact     v7.0.1
#   actions/download-artifact   v8.0.1
#   softprops/action-gh-release v3.0.2
#   pypa/gh-action-pypi-publish v1.14.2 (release/v1 branch, same commit)

on:
  push:
    tags:
      - "v*.*.*"
      - "contrib-v*.*.*"

jobs:
  build-presidium:
    name: Build presidium
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(grep '^version' packages/presidium/pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package version ($PKG_VERSION)"
            exit 1
          fi

      - name: Build wheel and sdist
        # 2026-08-22: real, previously-untested bug found and fixed here --
        # `uv build` run with a bare `working-directory: packages/presidium`
        # (the pre-existing pattern this workflow already had) places its
        # output in the WORKSPACE ROOT's dist/, not packages/presidium/dist/
        # -- confirmed directly, not assumed, before trusting this workflow
        # for a real release. `--package`/`-o` from the workspace root avoids
        # the ambiguity entirely. This workflow had never actually run for a
        # real tag push (no git tags exist yet), so this bug was never caught.
        run: uv build --package presidium -o packages/presidium/dist

      - name: Generate CycloneDX SBOM
        run: |
          uv tool run --from cyclonedx-bom cyclonedx-py environment \
            --output-format json \
            --output-file sbom-presidium.json
          uv tool run --from cyclonedx-bom cyclonedx-py environment \
            --output-format xml \
            --output-file sbom-presidium.xml
        working-directory: packages/presidium

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-presidium
          path: packages/presidium/dist/

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-presidium
          path: |
            packages/presidium/sbom-presidium.json
            packages/presidium/sbom-presidium.xml

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            packages/presidium/sbom-presidium.json
            packages/presidium/sbom-presidium.xml

  build-contrib:
    name: Build presidium-contrib
    if: startsWith(github.ref, 'refs/tags/contrib-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/contrib-v}"
          PKG_VERSION=$(grep '^version' packages/presidium-contrib/pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package version ($PKG_VERSION)"
            exit 1
          fi

      - name: Build wheel and sdist
        run: uv build --package presidium-contrib -o packages/presidium-contrib/dist

      - name: Generate CycloneDX SBOM
        run: |
          uv tool run --from cyclonedx-bom cyclonedx-py environment \
            --output-format json \
            --output-file sbom-presidium-contrib.json
          uv tool run --from cyclonedx-bom cyclonedx-py environment \
            --output-format xml \
            --output-file sbom-presidium-contrib.xml
        working-directory: packages/presidium-contrib

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-contrib
          path: packages/presidium-contrib/dist/

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-contrib
          path: |
            packages/presidium-contrib/sbom-presidium-contrib.json
            packages/presidium-contrib/sbom-presidium-contrib.xml

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: |
            packages/presidium-contrib/sbom-presidium-contrib.json
            packages/presidium-contrib/sbom-presidium-contrib.xml

  publish-presidium:
    name: Publish presidium to PyPI
    needs: build-presidium
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/presidium
    permissions:
      id-token: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-presidium
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (v1.14.2)

  publish-contrib:
    name: Publish presidium-contrib to PyPI
    needs: build-contrib
    if: startsWith(github.ref, 'refs/tags/contrib-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/presidium-contrib
    permissions:
      id-token: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-contrib
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (v1.14.2)
