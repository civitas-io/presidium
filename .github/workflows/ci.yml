name: CI

# Real, verified commit SHAs (never guessed) — same versions/lookup
# discipline as publish.yml in this repo.
#   actions/checkout   v7.0.1
#   astral-sh/setup-uv v10.0.1

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test-presidium:
    name: presidium (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2026-08-22: added 3.14 — both packages' own pyproject.toml
        # classifiers already claim 3.12/3.13/3.14 support, but this matrix
        # only ever tested 3.12/3.13. Real, previously-unverified gap, found
        # while hardening CI for the first real PyPI release.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --package presidium

      - name: Run tests
        run: uv run --package presidium pytest packages/presidium/tests/

  test-contrib:
    name: presidium-contrib (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --package presidium --package presidium-contrib

      - name: Run tests
        run: uv run --package presidium-contrib pytest packages/presidium-contrib/tests/

  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install all packages
        run: uv sync --all-extras --package presidium --package presidium-contrib

      - name: Ruff lint (presidium)
        run: uv run ruff check packages/presidium/src/ packages/presidium/tests/

      - name: Ruff format check (presidium)
        run: uv run ruff format --check packages/presidium/src/ packages/presidium/tests/

      - name: Ruff lint (presidium-contrib)
        run: uv run ruff check packages/presidium-contrib/src/ packages/presidium-contrib/tests/

      - name: Ruff format check (presidium-contrib)
        run: uv run ruff format --check packages/presidium-contrib/src/ packages/presidium-contrib/tests/

      - name: mypy (presidium)
        run: cd packages/presidium && uv run mypy src/presidium/

      - name: mypy (presidium-contrib)
        run: cd packages/presidium-contrib && uv run mypy src/presidium_contrib/
