<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Topology Derived from Trace Context</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#64748b">No graph database — group audit events by trace_id (tree) or root agent_id (forest)</text>

  <!-- Tree View (left) -->
  <text x="240" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#2563eb">Tree View (single trace)</text>

  <!-- Orchestrator -->
  <rect x="160" y="95" width="160" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="240" y="113" text-anchor="middle" font-size="11" fill="#1e40af">orchestrator</text>
  <text x="240" y="125" text-anchor="middle" font-size="9" fill="#3b82f6">trace: abc-123</text>

  <!-- Lines to children -->
  <line x1="200" y1="131" x2="95" y2="160" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="240" y1="131" x2="240" y2="160" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="280" y1="131" x2="385" y2="160" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- Research Agent -->
  <rect x="20" y="160" width="150" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="95" y="178" text-anchor="middle" font-size="11" fill="#1e40af">researcher</text>
  <text x="95" y="191" text-anchor="middle" font-size="9" fill="#64748b">$18.40 (80% of cost)</text>
  <text x="95" y="202" text-anchor="middle" font-size="9" fill="#64748b">45 LLM calls</text>

  <!-- Synthesis Agent -->
  <rect x="185" y="160" width="110" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="240" y="178" text-anchor="middle" font-size="11" fill="#1e40af">synthesizer</text>
  <text x="240" y="191" text-anchor="middle" font-size="9" fill="#64748b">$2.10 (9%)</text>
  <text x="240" y="202" text-anchor="middle" font-size="9" fill="#64748b">3 LLM calls</text>

  <!-- Review Agent -->
  <rect x="310" y="160" width="150" height="48" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="385" y="178" text-anchor="middle" font-size="11" fill="#1e40af">reviewer</text>
  <text x="385" y="191" text-anchor="middle" font-size="9" fill="#64748b">$2.50 (11% of cost)</text>
  <text x="385" y="202" text-anchor="middle" font-size="9" fill="#64748b">caught 30% of errors</text>

  <!-- Outcome -->
  <rect x="110" y="230" width="260" height="32" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="240" y="251" text-anchor="middle" font-size="11" fill="#166534">Outcome: vendor-approved → $45 value</text>

  <!-- Forest View (right) -->
  <text x="680" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#7c3aed">Forest View (across traces)</text>

  <!-- Tree 1 -->
  <rect x="550" y="95" width="110" height="28" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="605" y="113" text-anchor="middle" font-size="10" fill="#5b21b6">orchestrator</text>
  <line x1="585" y1="123" x2="572" y2="140" stroke="#c4b5fd" stroke-width="1"/>
  <line x1="605" y1="123" x2="605" y2="140" stroke="#c4b5fd" stroke-width="1"/>
  <line x1="625" y1="123" x2="638" y2="140" stroke="#c4b5fd" stroke-width="1"/>
  <rect x="552" y="140" width="40" height="20" rx="4" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="0.8"/>
  <text x="572" y="154" text-anchor="middle" font-size="8" fill="#7c3aed">res</text>
  <rect x="585" y="140" width="40" height="20" rx="4" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="0.8"/>
  <text x="605" y="154" text-anchor="middle" font-size="8" fill="#7c3aed">syn</text>
  <rect x="618" y="140" width="40" height="20" rx="4" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="0.8"/>
  <text x="638" y="154" text-anchor="middle" font-size="8" fill="#7c3aed">rev</text>
  <text x="605" y="175" text-anchor="middle" font-size="9" fill="#64748b">trace-001: $23 → $45</text>

  <!-- Tree 2 -->
  <rect x="700" y="95" width="110" height="28" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="755" y="113" text-anchor="middle" font-size="10" fill="#5b21b6">orchestrator</text>
  <line x1="735" y1="123" x2="722" y2="140" stroke="#c4b5fd" stroke-width="1"/>
  <line x1="755" y1="123" x2="755" y2="140" stroke="#c4b5fd" stroke-width="1"/>
  <line x1="775" y1="123" x2="788" y2="140" stroke="#c4b5fd" stroke-width="1"/>
  <rect x="702" y="140" width="40" height="20" rx="4" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="0.8"/>
  <text x="722" y="154" text-anchor="middle" font-size="8" fill="#7c3aed">res</text>
  <rect x="735" y="140" width="40" height="20" rx="4" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="0.8"/>
  <text x="755" y="154" text-anchor="middle" font-size="8" fill="#7c3aed">syn</text>
  <rect x="768" y="140" width="40" height="20" rx="4" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="0.8"/>
  <text x="788" y="154" text-anchor="middle" font-size="8" fill="#7c3aed">rev</text>
  <text x="755" y="175" text-anchor="middle" font-size="9" fill="#64748b">trace-002: $19 → $45</text>

  <!-- Aggregation -->
  <rect x="580" y="200" width="200" height="56" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="680" y="220" text-anchor="middle" font-size="11" font-weight="600" fill="#5b21b6">Forest Aggregate</text>
  <text x="680" y="235" text-anchor="middle" font-size="10" fill="#64748b">150 traces, $3,150 cost</text>
  <text x="680" y="248" text-anchor="middle" font-size="10" fill="#64748b">$6,750 value → 114% ROI</text>

  <!-- Key -->
  <rect x="40" y="290" width="820" height="115" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="312" font-size="12" font-weight="600" fill="#334155">How It Works</text>
  <text x="60" y="332" font-size="11" fill="#475569">1. Every audit event carries workflow.trace_id + workflow.span_id (OTel propagation)</text>
  <text x="60" y="350" font-size="11" fill="#475569">2. Tree view: GROUP BY trace_id → reconstruct parent-child from span hierarchy</text>
  <text x="60" y="368" font-size="11" fill="#475569">3. Forest view: GROUP BY root agent_id across all traces → aggregate cost/value</text>
  <text x="60" y="386" font-size="11" fill="#475569">4. No graph database, no workflow DAG extraction — derived from the audit stream</text>
</svg>
