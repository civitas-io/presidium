[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "presidium-contrib"
version = "0.7.0"
description = "Adapters and reference implementations for Presidium governance"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
keywords = ["agents", "governance", "adapters", "presidium", "civitas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "presidium>=0.4.0",  # 0.4.0: presidium.runtime.parse_policy_rules() is real and public
    # there as of 0.4.0 (promoted from a private helper) -- needed by
    # presidium_contrib.cli.policy's "policy validate" command. 0.3.0 also required for
    # presidium.providers.gateway (ToolsGatewayBackend), needed by
    # presidium_contrib.mcp_gateway.pipeline.GovernedMcpToolPipeline and agentgateway/client.py.
    "typer>=0.12",  # presidium_contrib.cli -- same always-core precedent civitas itself
    "rich>=13",     # uses for its own CLI (typer/rich are not gated behind an extra there).
]

[project.scripts]
presidium = "presidium_contrib.cli:main"

[project.optional-dependencies]
# Needed for `presidium registry list` -- SqliteRegistry lives in presidium core, gated
# behind presidium[sqlite] there; forwarded here so a plain `pip install
# presidium-contrib[sqlite]` is sufficient, matching how every other CLI-adjacent extra works.
sqlite = ["presidium[sqlite]>=0.3.0"]
opa = ["httpx>=0.27"]
openbao = ["hvac>=2.0"]
agentgateway = ["httpx>=0.27", "mcp>=2.0", "a2a-sdk>=1.1.2"]
spiffe = ["spiffe>=0.3.1"]
slack = ["slack-sdk>=3.27", "aiohttp>=3.9"]
webhook = ["httpx>=0.27"]
postgres = ["asyncpg>=0.29"]
# Presidium Server (M7) -- civitas[http] for HTTPGateway/uvicorn/pydantic,
# cryptography directly for mTLS client-cert DN extraction (civitas's own
# civitas.gateway.mtls needs it independent of the jwt extra, which pulls in
# unrelated JWT-signing machinery this milestone doesn't use).
server = ["civitas[http]>=0.11.0", "cryptography>=41"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/presidium_contrib"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=presidium_contrib --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["presidium_contrib"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
    "^\\s+\\.\\.\\.$",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["presidium_contrib", "presidium"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["civitas", "civitas.*", "celpy", "celpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["hvac", "hvac.*", "slack_sdk", "slack_sdk.*", "asyncpg", "asyncpg.*"]
ignore_missing_imports = true
