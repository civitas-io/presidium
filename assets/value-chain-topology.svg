<svg viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Topology Derived from Trace Context</text>
  <text x="350" y="50" text-anchor="middle" font-size="11" fill="#64748b">No graph database — derived from audit events via OTel trace_id</text>

  <!-- ===== SECTION 1: Tree View ===== -->
  <rect x="20" y="65" width="660" height="250" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="350" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#2563eb">Tree View — single workflow trace</text>

  <!-- Orchestrator -->
  <rect x="235" y="105" width="230" height="34" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="350" y="127" text-anchor="middle" font-size="12" fill="#1e40af">orchestrator  ·  trace: abc-123</text>

  <!-- Lines down to three children -->
  <line x1="280" y1="139" x2="130" y2="165" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="350" y1="139" x2="350" y2="165" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="420" y1="139" x2="570" y2="165" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- Researcher (left) -->
  <rect x="40" y="165" width="180" height="55" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="130" y="186" text-anchor="middle" font-size="12" font-weight="500" fill="#1e40af">researcher</text>
  <text x="130" y="201" text-anchor="middle" font-size="10" fill="#64748b">$18.40  ·  80% of cost</text>
  <text x="130" y="214" text-anchor="middle" font-size="10" fill="#64748b">45 LLM calls</text>

  <!-- Synthesizer (center) -->
  <rect x="250" y="165" width="200" height="55" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="350" y="186" text-anchor="middle" font-size="12" font-weight="500" fill="#1e40af">synthesizer</text>
  <text x="350" y="201" text-anchor="middle" font-size="10" fill="#64748b">$2.10  ·  9% of cost</text>
  <text x="350" y="214" text-anchor="middle" font-size="10" fill="#64748b">3 LLM calls</text>

  <!-- Reviewer (right) -->
  <rect x="480" y="165" width="180" height="55" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="570" y="186" text-anchor="middle" font-size="12" font-weight="500" fill="#1e40af">reviewer</text>
  <text x="570" y="201" text-anchor="middle" font-size="10" fill="#64748b">$2.50  ·  11% of cost</text>
  <text x="570" y="214" text-anchor="middle" font-size="10" fill="#64748b">caught 30% of errors</text>

  <!-- Arrow down to outcome -->
  <line x1="350" y1="220" x2="350" y2="248" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <!-- Outcome -->
  <rect x="160" y="250" width="380" height="34" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="350" y="272" text-anchor="middle" font-size="12" fill="#166534">Outcome: vendor-approved  →  $45 value</text>

  <!-- ===== SECTION 2: Forest View ===== -->
  <rect x="20" y="335" width="660" height="180" rx="10" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
  <text x="350" y="358" text-anchor="middle" font-size="14" font-weight="600" fill="#7c3aed">Forest View — aggregated across traces</text>

  <!-- Mini Tree 1 -->
  <rect x="60" y="375" width="160" height="30" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="140" y="395" text-anchor="middle" font-size="11" fill="#5b21b6">orchestrator</text>
  <line x1="110" y1="405" x2="100" y2="418" stroke="#c4b5fd" stroke-width="1"/>
  <line x1="140" y1="405" x2="140" y2="418" stroke="#c4b5fd" stroke-width="1"/>
  <line x1="170" y1="405" x2="180" y2="418" stroke="#c4b5fd" stroke-width="1"/>
  <circle cx="100" cy="424" r="5" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="0.8"/>
  <circle cx="140" cy="424" r="5" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="0.8"/>
  <circle cx="180" cy="424" r="5" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="0.8"/>
  <text x="140" y="448" text-anchor="middle" font-size="10" fill="#64748b">trace-001:  $23 → $45</text>

  <!-- Mini Tree 2 -->
  <rect x="270" y="375" width="160" height="30" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="350" y="395" text-anchor="middle" font-size="11" fill="#5b21b6">orchestrator</text>
  <line x1="320" y1="405" x2="310" y2="418" stroke="#c4b5fd" stroke-width="1"/>
  <line x1="350" y1="405" x2="350" y2="418" stroke="#c4b5fd" stroke-width="1"/>
  <line x1="380" y1="405" x2="390" y2="418" stroke="#c4b5fd" stroke-width="1"/>
  <circle cx="310" cy="424" r="5" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="0.8"/>
  <circle cx="350" cy="424" r="5" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="0.8"/>
  <circle cx="390" cy="424" r="5" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="0.8"/>
  <text x="350" y="448" text-anchor="middle" font-size="10" fill="#64748b">trace-002:  $19 → $45</text>

  <!-- Ellipsis -->
  <text x="510" y="415" text-anchor="middle" font-size="20" fill="#a78bfa">···</text>
  <text x="580" y="415" text-anchor="middle" font-size="11" fill="#a78bfa">150 traces</text>

  <!-- Aggregation box -->
  <rect x="160" y="465" width="380" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="350" y="487" text-anchor="middle" font-size="12" font-weight="600" fill="#5b21b6">Aggregate:  $3,150 cost  ·  $6,750 value  ·  114% ROI</text>

  <!-- ===== SECTION 3: How It Works ===== -->
  <rect x="20" y="535" width="660" height="150" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="350" y="560" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">How It Works</text>

  <text x="45" y="585" font-size="11" fill="#475569">1.  Every audit event carries workflow.trace_id + workflow.span_id (OTel propagation)</text>
  <text x="45" y="608" font-size="11" fill="#475569">2.  Tree view:  GROUP BY trace_id  →  reconstruct parent-child from span hierarchy</text>
  <text x="45" y="631" font-size="11" fill="#475569">3.  Forest view:  GROUP BY root agent_id across traces  →  aggregate cost and value</text>
  <text x="45" y="654" font-size="11" fill="#475569">4.  No graph database.  No workflow DAG extraction.  Derived entirely from audit stream.</text>
  <text x="45" y="675" font-size="11" font-weight="600" fill="#7c3aed">Key:  tree = one trace  ·  forest = many traces  ·  both computed, never stored</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
